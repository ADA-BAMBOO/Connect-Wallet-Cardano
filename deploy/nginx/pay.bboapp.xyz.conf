# =============================================================================
# pay.bboapp.xyz  →  192.168.79.59:4000  (Next.js, `npm start`)
# =============================================================================
# File này chạy trên MÁY aaPanel (máy cầm IP công cộng), không phải trên máy app.
# Máy app là VM 192.168.79.59 trong LAN, chỉ có IP nội bộ.
#
#   Internet ──► máy aaPanel :443 (TLS ở đây) ──LAN──► 192.168.79.59:4000
#
# aaPanel: Website → Add site (pay.bboapp.xyz) → SSL → Let's Encrypt →
# Force HTTPS → Config file → dán khối `location /` bên dưới, xoá các location
# mặc định phục vụ file tĩnh và PHP.

server {
    listen 80;
    listen [::]:80;
    server_name pay.bboapp.xyz;

    # Trừ đường xác thực ACME, còn lại đẩy hết sang https.
    location /.well-known/acme-challenge/ { root /www/wwwroot/pay.bboapp.xyz; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pay.bboapp.xyz;

    ssl_certificate     /www/server/panel/vhost/cert/pay.bboapp.xyz/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/pay.bboapp.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS: bật SAU khi đã chắc chắn https chạy ổn. Bật sớm mà chứng chỉ hỏng thì
    # trình duyệt không cho khách vào bằng http để sửa.
    # add_header Strict-Transport-Security "max-age=31536000" always;

    # Body của /api/v1/orders chỉ vài trăm byte. Không có lý do nhận file lớn.
    client_max_body_size 1m;

    access_log /www/wwwlogs/pay.bboapp.xyz.log;
    error_log  /www/wwwlogs/pay.bboapp.xyz.error.log;

    location / {
        proxy_pass http://192.168.79.59:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;

        # $proxy_add_x_forwarded_for NỐI THÊM ip thật vào cuối chuỗi client gửi lên.
        # Ứng dụng đọc phần tử thứ `TRUSTED_PROXY_HOPS` tính từ phải sang, nên với
        # TRUSTED_PROXY_HOPS=1 nó lấy đúng giá trị nginx vừa ghi — thứ duy nhất
        # client không giả được. Đừng đổi thành `$remote_addr`: có Cloudflare ở
        # trước là hạn mức đọc nhầm IP của Cloudflare.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Trang /pay/<ref> poll trạng thái liên tục; đừng để nginx gom buffer rồi
        # nhả một cục.
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Tài nguyên build mang hash trong tên file nên không bao giờ đổi nội dung —
    # cho trình duyệt giữ lâu. Next đã tự gửi Cache-Control đúng cho đường này;
    # khối này chỉ để nginx khỏi thêm header nào chặt hơn.
    location /_next/static/ {
        proxy_pass http://192.168.79.59:4000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
