# =============================================================================
# demo.bboapp.xyz  →  192.168.79.59:4100  (demo/kolo-shop/server.ts)
# =============================================================================
# File này chạy trên MÁY aaPanel (máy cầm IP công cộng), không phải trên máy app.
# Máy app là VM 192.168.79.59 trong LAN, chỉ có IP nội bộ.
#
#   Internet ──► máy aaPanel :443 (TLS ở đây) ──LAN──► 192.168.79.59:4100
#
# aaPanel: Website → Add site (demo.bboapp.xyz) → SSL → Let's Encrypt →
# Force HTTPS → Config file → dán khối `location /` bên dưới, xoá các location
# mặc định phục vụ file tĩnh và PHP.

server {
    listen 80;
    listen [::]:80;
    server_name demo.bboapp.xyz;

    location /.well-known/acme-challenge/ { root /www/wwwroot/demo.bboapp.xyz; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demo.bboapp.xyz;

    ssl_certificate     /www/server/panel/vhost/cert/demo.bboapp.xyz/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/demo.bboapp.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 1m;

    access_log /www/wwwlogs/demo.bboapp.xyz.log;
    error_log  /www/wwwlogs/demo.bboapp.xyz.error.log;

    location / {
        proxy_pass http://192.168.79.59:4100;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
