# =============================================================================
# demo.bboapp.xyz  →  127.0.0.1:4100  (demo/kolo-shop/server.ts)
# =============================================================================
# Giống cấu hình của pay.bboapp.xyz, chỉ khác cổng và không có /_next/static.
# Đường /api/webhooks/kolo-pay là nơi cổng thanh toán POST vào — nếu bật WAF
# của aaPanel, phải bỏ qua đường này (xem deploy/README.md mục 6).

server {
    listen 80;
    listen [::]:80;
    server_name demo.bboapp.xyz;

    location /.well-known/acme-challenge/ { root /www/wwwroot/demo.bboapp.xyz; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name demo.bboapp.xyz;

    ssl_certificate     /www/server/panel/vhost/cert/demo.bboapp.xyz/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/demo.bboapp.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 1m;

    access_log /www/wwwlogs/demo.bboapp.xyz.log;
    error_log  /www/wwwlogs/demo.bboapp.xyz.error.log;

    location / {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_read_timeout 120s;
    }
}
